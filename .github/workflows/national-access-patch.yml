name: National access patch

on:
  push:
    paths:
      - '.github/workflows/national-access-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch national access support
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              'type MunicipioPermitido = { clave: string; nombre: string };\ntype Acceso = {\n  correo: string;\n  estado: { clave: string; nombre: string };\n  municipios: MunicipioPermitido[];\n};',
              'type EstadoPermitido = { clave: string; nombre: string };\ntype MunicipioPermitido = { clave: string; nombre: string; claveEstado?: string };\ntype Acceso = {\n  correo: string;\n  estado: EstadoPermitido;\n  estados: EstadoPermitido[];\n  municipios: MunicipioPermitido[];\n};'
            ),
            (
              'setAcceso({ correo: data.correo, estado: data.estado, municipios: data.municipios ?? [] });\n        setCorreoResponsable(data.correo);\n        setEstado(data.estado.clave);',
              'setAcceso({ correo: data.correo, estado: data.estado, estados: data.estados ?? [], municipios: data.municipios ?? [] });\n        setCorreoResponsable(data.correo);\n        setEstado(data.estado.clave === "00" ? "" : data.estado.clave);'
            ),
            (
              '  const opcionesMunicipios = useMemo(() => acceso?.municipios.map((item) => item.nombre) ?? [], [acceso]);\n  const claveMunicipio = useMemo(\n    () => new Map(acceso?.municipios.map((item) => [item.nombre, item.clave]) ?? []),\n    [acceso],\n  );',
              '  const esNacional = acceso?.estado.clave === "00";\n  const estadoSeleccionado = useMemo(() => esNacional ? acceso?.estados.find((item) => item.clave === estado) : acceso?.estado, [acceso, esNacional, estado]);\n  const municipiosPermitidos = useMemo(() => {\n    if (!acceso) return [];\n    if (!esNacional) return acceso.municipios;\n    if (!estado) return [];\n    return acceso.municipios.filter((item) => item.claveEstado === estado);\n  }, [acceso, esNacional, estado]);\n  const opcionesMunicipios = useMemo(() => municipiosPermitidos.map((item) => item.nombre), [municipiosPermitidos]);\n  const claveMunicipio = useMemo(\n    () => new Map(municipiosPermitidos.map((item) => [item.nombre, item.clave])),\n    [municipiosPermitidos],\n  );'
            ),
            (
              '          estado: acceso?.estado,',
              '          estado: estadoSeleccionado,'
            ),
            (
              '<label>Estado autorizado<input readOnly value={acceso.estado.nombre} className="locked-field" /></label>',
              '{esNacional ? <label>Estado <b>*</b><select required aria-invalid={mostrarErrores && !estado} value={estado} onChange={(e) => { setEstado(e.target.value); setPlanteles({}); setMunicipioActivo(""); setBusquedaMunicipio(""); }}><option value="">Seleccione un estado</option>{acceso.estados.map((item) => <option key={item.clave} value={item.clave}>{item.nombre}</option>)}</select>{mostrarErrores && !estado && <span className="field-error visible">Seleccione un estado.</span>}</label> : <label>Estado autorizado<input readOnly value={acceso.estado.nombre} className="locked-field" /></label>}'
            ),
            (
              '<div className="review-contact"><strong>{nombreResponsable}</strong><span>{correoResponsable}</span><span>{acceso.estado.nombre}</span></div>',
              '<div className="review-contact"><strong>{nombreResponsable}</strong><span>{correoResponsable}</span><span>{estadoSeleccionado?.nombre ?? acceso.estado.nombre}</span></div>'
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
            s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Support national state selection in alta flow"
          git push origin main
